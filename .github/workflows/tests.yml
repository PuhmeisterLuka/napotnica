name: tests

on: push

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # No browser download: the scrape-marked tests are excluded, and every other
      # test parses saved fixtures instead of driving Playwright.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -m "not scrape"
