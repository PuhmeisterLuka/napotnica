[project]
name = "napotnica"
version = "0.1.0"
description = "Student job exporter and AI CV assistant for Slovenian student work listings"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "playwright==1.61.0",
    "groq==1.5.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-m 'not scrape'"
markers = [
    "scrape: tests that need a live browser or network (excluded by default)",
]
testpaths = ["tests"]
pythonpath = ["."]
